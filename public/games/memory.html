<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Memory Match</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d0d0f;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:sans-serif;color:#e8e8ed;user-select:none;padding:16px}
.header{margin-bottom:16px;text-align:center}
.score{font-size:18px;font-weight:700;color:#e8a0bf}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:340px;width:100%}
.card{aspect-ratio:1;background:#22222a;border:2px solid #2a2a30;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:32px;cursor:pointer;transition:all 0.3s;-webkit-tap-highlight-color:transparent}
.card.flipped,.card.matched{background:#16161a;border-color:#e8a0bf;transform:rotateY(0)}
.card.matched{border-color:#50c878;opacity:0.7}
.card:not(.flipped):not(.matched):hover{border-color:#444}
.card:not(.flipped):not(.matched) .emoji{display:none}
.restart{margin-top:16px;background:#e8a0bf;color:#0d0d0f;border:none;border-radius:8px;padding:10px 24px;font-size:14px;font-weight:600;cursor:pointer}
.restart:hover{background:#f0b8d0}
</style>
</head>
<body>
<div class="header">
<div class="score">Moves: <span id="moves">0</span> | Pairs: <span id="pairs">0</span>/8</div>
</div>
<div class="grid" id="grid"></div>
<button class="restart" id="restart">New Game</button>
<script>
const emojis=["🌸","🎮","🎵","🚀","🌈","🔥","💎","🍕"];
let cards=[],flipped=[],matched=0,moves=0,locked=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function init(){const grid=document.getElementById("grid");grid.innerHTML="";cards=[];flipped=[];matched=0;moves=0;locked=false;
document.getElementById("moves").textContent=0;document.getElementById("pairs").textContent="0";
const deck=shuffle([...emojis,...emojis]);
for(let i=0;i<deck.length;i++){const card=document.createElement("div");card.className="card";const span=document.createElement("span");span.className="emoji";span.textContent=deck[i];card.appendChild(span);card.dataset.idx=i;card.dataset.emoji=deck[i];card.addEventListener("click",()=>flip(card));grid.appendChild(card);cards.push(card);}}
function flip(card){if(locked||card.classList.contains("flipped")||card.classList.contains("matched"))return;
card.classList.add("flipped");flipped.push(card);
if(flipped.length===2){moves++;document.getElementById("moves").textContent=moves;locked=true;
const[a,b]=flipped;
if(a.dataset.emoji===b.dataset.emoji){a.classList.add("matched");b.classList.add("matched");matched++;document.getElementById("pairs").textContent=matched;flipped=[];locked=false;
if(matched===emojis.length){setTimeout(()=>alert("You won in "+moves+" moves!"),300);}}
else{setTimeout(()=>{a.classList.remove("flipped");b.classList.remove("flipped");flipped=[];locked=false;},700);}}}
document.getElementById("restart").addEventListener("click",init);
init();
</script>
</body>
</html>
