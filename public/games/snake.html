<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snake</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d0d0f;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;color:#e8e8ed;user-select:none}
canvas{border:2px solid #2a2a30;border-radius:8px;background:#16161a;touch-action:none}
.score{margin:12px 0;font-size:18px;font-weight:700;color:#e8a0bf}
.controls{display:flex;gap:8px;margin-top:12px}
.controls button{width:48px;height:48px;border:1px solid #2a2a30;border-radius:8px;background:#22222a;color:#e8e8ed;font-size:20px;cursor:pointer}
.controls button:active{background:#e8a0bf;color:#0d0d0f}
.info{color:#8888a0;font-size:12px;margin-top:8px}
</style>
</head>
<body>
<div class="score">Score: <span id="score">0</span></div>
<canvas id="c" width="320" height="320"></canvas>
<div class="controls">
<button id="bl">&larr;</button>
<button id="bu">&uarr;</button>
<button id="bd">&darr;</button>
<button id="br">&rarr;</button>
</div>
<div class="info">Arrow keys or buttons to move</div>
<script>
const c=document.getElementById("c"),ctx=c.getContext("2d"),S=20,W=c.width/S,H=c.height/S;
let snake=[{x:5,y:5}],dir={x:1,y:0},food=spawn(),score=0,dead=false,interval;
function spawn(){let p;do{p={x:Math.floor(Math.random()*W),y:Math.floor(Math.random()*H)}}while(snake.some(s=>s.x===p.x&&s.y===p.y));return p;}
function draw(){ctx.fillStyle="#16161a";ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle="#e8a0bf";for(const s of snake){ctx.beginPath();ctx.roundRect(s.x*S+1,s.y*S+1,S-2,S-2,4);ctx.fill();}ctx.fillStyle="#c084fc";ctx.beginPath();ctx.arc(food.x*S+S/2,food.y*S+S/2,S/2-2,0,Math.PI*2);ctx.fill();if(dead){ctx.fillStyle="rgba(0,0,0,0.6)";ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle="#e85050";ctx.font="bold 24px sans-serif";ctx.textAlign="center";ctx.fillText("Game Over",c.width/2,c.height/2-10);ctx.font="14px sans-serif";ctx.fillStyle="#e8e8ed";ctx.fillText("Tap or press any key to restart",c.width/2,c.height/2+16);}}
function tick(){if(dead)return;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(head.x<0||head.x>=W||head.y<0||head.y>=H||snake.some(s=>s.x===head.x&&s.y===head.y)){dead=true;draw();return;}snake.unshift(head);if(head.x===food.x&&head.y===food.y){score++;document.getElementById("score").textContent=score;food=spawn();}else{snake.pop();}draw();}
function setDir(x,y){if(dir.x===-x&&dir.y===-y)return;dir={x,y};}
function restart(){snake=[{x:5,y:5}];dir={x:1,y:0};food=spawn();score=0;dead=false;document.getElementById("score").textContent=0;clearInterval(interval);interval=setInterval(tick,110);draw();}
document.addEventListener("keydown",e=>{if(dead){restart();return;}if(e.key==="ArrowUp")setDir(0,-1);else if(e.key==="ArrowDown")setDir(0,1);else if(e.key==="ArrowLeft")setDir(-1,0);else if(e.key==="ArrowRight")setDir(1,0);});
c.addEventListener("click",()=>{if(dead)restart();});
document.getElementById("bu").onclick=()=>{if(dead){restart();return;}setDir(0,-1);};
document.getElementById("bd").onclick=()=>{if(dead){restart();return;}setDir(0,1);};
document.getElementById("bl").onclick=()=>{if(dead){restart();return;}setDir(-1,0);};
document.getElementById("br").onclick=()=>{if(dead){restart();return;}setDir(1,0);};
restart();
</script>
</body>
</html>
