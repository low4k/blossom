<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Blossom, a quiet sakura-at-night portal. Sign in to continue." />
  <meta name="robots" content="noindex, nofollow" />
  <meta property="og:title" content="Blossom" />
  <meta property="og:description" content="Sign in to continue." />
  <title>Blossom</title>
  <link rel="icon" href="https://www.google.com/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@600&text=%E5%A4%9C%E6%A1%9C&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #120a10;
      --bg-card: rgba(255, 235, 245, 0.05);
      --bg-input: rgba(255, 235, 245, 0.06);
      --text: #f7edf2;
      --text-dim: #c9b3c0;
      --accent: #ff9ec4;
      --accent-hover: #e85d96;
      --accent-deep: #c13584;
      --accent-grad: linear-gradient(135deg, #ff9ec4 0%, #e85d96 100%);
      --border-soft: rgba(255, 158, 196, 0.18);
      --danger: #e85050;
      --radius: 22px;
      --radius-sm: 12px;
      --font-serif: "Cormorant Garamond", "Playfair Display", Georgia, serif;
      --font-body: "Outfit", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-kanji: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif;
    }

    html, body {
      height: 100%;
      font-family: var(--font-body);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background:
        radial-gradient(ellipse 90% 55% at 50% -8%, rgba(255, 150, 190, 0.14), transparent 62%),
        radial-gradient(ellipse 60% 45% at 88% 108%, rgba(193, 53, 132, 0.10), transparent 60%),
        linear-gradient(180deg, #1e0f18 0%, #120a10 55%, #2a1420 100%);
      background-attachment: fixed;
    }

    /* Split shell: sakura art panel + glass form card */
    .auth-shell {
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 100%;
      max-width: 860px;
      margin: 16px;
      border-radius: var(--radius);
      overflow: hidden;
      background: rgba(30, 16, 24, 0.55);
      border: 1px solid var(--border-soft);
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.55),
        0 0 60px rgba(255, 158, 196, 0.06);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      animation: cardIn 0.6s ease both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(18px) scale(0.985); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .auth-art {
      position: relative;
      background: linear-gradient(165deg, #2a1420 0%, #1e0f18 55%, #120a10 100%);
      overflow: hidden;
      min-height: 560px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 28px;
    }
    .auth-art img.art-branch {
      position: absolute;
      top: -24px;
      left: -30px;
      width: 130%;
      opacity: 0.5;
      user-select: none;
    }
    .auth-art .art-blossom {
      position: absolute;
      top: 13%;
      right: -34px;
      width: 200px;
      opacity: 0.92;
      filter: drop-shadow(0 0 34px rgba(255, 158, 196, 0.35));
      animation: floatBlossom 7s ease-in-out infinite;
    }
    @keyframes floatBlossom {
      0%, 100% { transform: translateY(0) rotate(-4deg); }
      50%      { transform: translateY(-12px) rotate(3deg); }
    }
    .auth-art .art-kanji {
      position: absolute;
      top: 22px;
      right: 18px;
      writing-mode: vertical-rl;
      font-family: var(--font-kanji);
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.42em;
      color: var(--accent);
      opacity: 0;
      animation: kanjiIn 1.2s ease 0.55s forwards;
    }
    @keyframes kanjiIn {
      from { opacity: 0; transform: translateY(-16px); }
      to   { opacity: 0.6; transform: translateY(0); }
    }
    .auth-art .art-word {
      position: relative;
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 46px;
      background: linear-gradient(120deg, #ffd9e8, var(--accent) 50%, var(--accent-hover));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.08;
    }
    .auth-art .art-caption {
      position: relative;
      color: var(--text-dim);
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      margin-top: 10px;
    }

    .auth-card {
      padding: 44px 38px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    @media (max-width: 760px) {
      .auth-shell { grid-template-columns: 1fr; max-width: 440px; }
      .auth-art { display: none; }
      .auth-card { padding: 36px 26px; }
    }

    .auth-logo {
      text-align: center;
      margin-bottom: 30px;
    }
    .auth-logo h1 {
      font-family: var(--font-serif);
      font-size: 34px;
      font-weight: 700;
      background: linear-gradient(120deg, #ffd9e8, var(--accent) 50%, var(--accent-hover));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .auth-logo p {
      color: var(--text-dim);
      font-size: 13px;
      margin-top: 6px;
      letter-spacing: 0.02em;
    }

    .tab-row {
      position: relative;
      display: flex;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border-soft);
    }
    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 14px;
      font-weight: 600;
      padding: 12px 0 14px;
      cursor: pointer;
      transition: color 0.25s ease;
    }
    .tab-btn.active { color: var(--accent); }
    .tab-underline {
      position: absolute;
      bottom: -1px;
      left: 0;
      width: 50%;
      height: 2px;
      background: var(--accent-grad);
      border-radius: 2px;
      box-shadow: 0 0 12px rgba(255, 158, 196, 0.55);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-dim);
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 15px;
      padding: 12px 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-group input:focus {
      border-color: rgba(255, 158, 196, 0.65);
      box-shadow: 0 0 0 3px rgba(255, 158, 196, 0.14), 0 0 18px rgba(255, 158, 196, 0.1);
    }
    .form-group input::placeholder {
      color: var(--text-dim);
      opacity: 0.6;
    }

    .auth-submit {
      width: 100%;
      padding: 13px 0;
      background: var(--accent-grad);
      color: #2a1420;
      border: none;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: filter 0.2s, transform 0.15s, box-shadow 0.2s;
      margin-top: 8px;
    }
    .auth-submit:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(232, 93, 150, 0.4);
    }
    .auth-submit:active { transform: scale(0.98); }
    .auth-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    .auth-error {
      color: var(--danger);
      font-size: 13px;
      text-align: center;
      margin-top: 12px;
      min-height: 18px;
    }

    /* GitHub star link */
    .gh-star {
      position: fixed;
      left: 14px;
      bottom: 14px;
      z-index: 6;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--accent);
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: 8px;
      text-decoration: none;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .gh-star:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      box-shadow: 0 6px 18px rgba(232, 93, 150, 0.3);
    }
    .gh-star svg { transition: transform 0.35s cubic-bezier(0.22, 0.9, 0.25, 1.3); }
    .gh-star:hover svg { transform: rotate(-12deg) scale(1.15); }

    /* Gate transition: sakura columns slide down, carry us home */
    .gate-overlay {
      position: fixed;
      inset: 0;
      z-index: 500;
      display: flex;
      pointer-events: none;
    }
    .gate-panel {
      flex: 1 1 0;
      transform: translateY(-102%);
      transition: transform 0.5s cubic-bezier(0.65, 0, 0.25, 1);
    }
    .gate-panel:nth-child(1) { background: #1e0f18; transition-delay: 0s; }
    .gate-panel:nth-child(2) { background: #5e2447; transition-delay: 0.06s; }
    .gate-panel:nth-child(3) { background: #a03468; transition-delay: 0.12s; }
    .gate-panel:nth-child(4) { background: #d64d86; transition-delay: 0.18s; }
    .gate-panel:nth-child(5) { background: #f5a9c8; transition-delay: 0.24s; }
    .gate-overlay.play .gate-panel { transform: translateY(0); }

    [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="auth-shell">
    <div class="auth-art" aria-hidden="true">
      <img src="/branch.svg" alt="" class="art-branch" />
      <svg class="art-blossom" viewBox="0 0 32 32"><defs><radialGradient id="art-g" cx="0.4" cy="0.35" r="0.9"><stop offset="0" stop-color="#ffd9e8"/><stop offset="1" stop-color="#e85d96"/></radialGradient></defs><g fill="url(#art-g)"><ellipse cx="16" cy="8.2" rx="4.6" ry="7"/><ellipse cx="16" cy="8.2" rx="4.6" ry="7" transform="rotate(72 16 16)"/><ellipse cx="16" cy="8.2" rx="4.6" ry="7" transform="rotate(144 16 16)"/><ellipse cx="16" cy="8.2" rx="4.6" ry="7" transform="rotate(216 16 16)"/><ellipse cx="16" cy="8.2" rx="4.6" ry="7" transform="rotate(288 16 16)"/></g><circle cx="16" cy="16" r="3" fill="#c13584"/><g fill="#ffd9e8"><circle cx="16" cy="12.6" r="1"/><circle cx="19.2" cy="17.4" r="1"/><circle cx="12.8" cy="17.4" r="1"/></g></svg>
      <div class="art-kanji" lang="ja" aria-hidden="true">夜桜</div>
      <div>
        <div class="art-word">Blossom</div>
        <div class="art-caption">Sakura at night</div>
      </div>
    </div>

    <div class="auth-form-col">
    <div class="auth-card">
      <div class="auth-logo">
        <h1>Welcome back</h1>
        <p>The blossoms kept your seat.</p>
      </div>

      <div class="tab-row">
        <button class="tab-btn active" id="tab-login" type="button">Sign In</button>
        <button class="tab-btn" id="tab-register" type="button">Create Account</button>
        <div class="tab-underline" id="tab-underline"></div>
      </div>

    <form id="login-form">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="you@email.com" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-pass" placeholder="••••••••" required autocomplete="current-password" />
      </div>
      <div class="form-group" id="login-totp-group" hidden>
        <label>2FA Code</label>
        <input type="text" id="login-totp" inputmode="numeric" maxlength="6" placeholder="6-digit code" autocomplete="one-time-code" />
        <p class="auth-hint" style="font-size: 12px; color: var(--text-dim); margin-top: 6px;">Enter the code from your authenticator app.</p>
      </div>
      <button type="submit" class="auth-submit">Sign In</button>
      <div id="login-error" class="auth-error"></div>
    </form>

    <form id="register-form" hidden>
      <div class="form-group">
        <label>Display Name</label>
        <input type="text" id="reg-name" placeholder="Your name" autocomplete="name" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="you@email.com" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="reg-pass" placeholder="8+ chars, letter and number" required minlength="8" autocomplete="new-password" />
      </div>
      <div class="form-group" id="reg-invite-group" hidden>
        <label>Invite Code</label>
        <input type="text" id="reg-invite" placeholder="Invite code" autocomplete="off" />
      </div>
      <button type="submit" class="auth-submit">Create Account</button>
      <div id="register-error" class="auth-error"></div>
    </form>
    </div>
  </div>

  <a class="gh-star" href="https://github.com/low4k/blossom" target="_blank" rel="noopener noreferrer" aria-label="Star Blossom on GitHub" title="Star Blossom on GitHub">
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5-5.9-3.2-5.9 3.2 1.2-6.5L2.5 9.4l6.6-.9z"/></svg>
    <span>Star on GitHub</span>
  </a>

  <div class="gate-overlay" id="gate-overlay" hidden aria-hidden="true">
    <div class="gate-panel"></div>
    <div class="gate-panel"></div>
    <div class="gate-panel"></div>
    <div class="gate-panel"></div>
    <div class="gate-panel"></div>
  </div>

  <script type="module">
    import { initPetals } from "/js/petals.js";
    initPetals();
  </script>

  <script>

    fetch("/auth/status").then(r => r.json()).then(s => { if (s.authenticated) window.location.replace("/"); });

    // Geometric sakura handoff: columns drop in, then the home page lifts them.
    function gateGo(url) {
      const ov = document.getElementById("gate-overlay");
      if (!ov || window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        window.location.replace(url);
        return;
      }
      try { sessionStorage.setItem("blossom-gate", "1"); } catch (e) {}
      ov.hidden = false;
      requestAnimationFrame(() => requestAnimationFrame(() => ov.classList.add("play")));
      setTimeout(() => window.location.replace(url), 470);
    }

    const tabLogin = document.getElementById("tab-login");
    const tabReg = document.getElementById("tab-register");
    const tabUnderline = document.getElementById("tab-underline");
    const loginForm = document.getElementById("login-form");
    const regForm = document.getElementById("register-form");

    function setActiveTab(which) {
      if (which === "register") {
        tabReg.classList.add("active"); tabLogin.classList.remove("active");
        regForm.hidden = false; loginForm.hidden = true;
        tabUnderline.style.transform = "translateX(100%)";
      } else {
        tabLogin.classList.add("active"); tabReg.classList.remove("active");
        loginForm.hidden = false; regForm.hidden = true;
        tabUnderline.style.transform = "translateX(0)";
      }
    }
    tabLogin.addEventListener("click", () => setActiveTab("login"));
    tabReg.addEventListener("click", () => setActiveTab("register"));

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const errEl = document.getElementById("login-error");
      const btn = loginForm.querySelector(".auth-submit");
      errEl.textContent = "";
      btn.disabled = true;
      try {
        const res = await fetch("/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: document.getElementById("login-email").value.trim(),
            password: document.getElementById("login-pass").value,
            totp: document.getElementById("login-totp").value.trim(),
          }),
        });
        const data = await res.json();
        if (!res.ok) {
          errEl.textContent = data.error || "Login failed";
          // 2FA enabled: reveal the code field and prompt for the next code
          if (data.totpRequired) {
            document.getElementById("login-totp-group").hidden = false;
            document.getElementById("login-totp").focus();
          }
          return;
        }
        gateGo("/");
      } catch { errEl.textContent = "Network error"; }
      finally { btn.disabled = false; }
    });

    regForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const errEl = document.getElementById("register-error");
      const btn = regForm.querySelector(".auth-submit");
      errEl.textContent = "";
      btn.disabled = true;
      try {
        const res = await fetch("/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: document.getElementById("reg-email").value.trim(),
            password: document.getElementById("reg-pass").value,
            displayName: document.getElementById("reg-name").value.trim(),
            inviteCode: document.getElementById("reg-invite").value.trim(),
          }),
        });
        const data = await res.json();
        if (!res.ok) {
          if (res.status === 403) document.getElementById("reg-invite-group").hidden = false;
          errEl.textContent = data.error || "Registration failed";
          return;
        }
        gateGo("/");
      } catch { errEl.textContent = "Network error"; }
      finally { btn.disabled = false; }
    });
</script>
</body>
</html>
