<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Student learning portal — sign in to access educational resources and study tools." />
  <meta name="keywords" content="education, student portal, learning, classroom, study tools" />
  <meta name="robots" content="noindex, nofollow" />
  <meta property="og:title" content="Student Portal — Sign In" />
  <meta property="og:description" content="Sign in to access your educational resources and study materials." />
  <title>Student Portal — Sign In</title>
  <link rel="icon" href="https://www.google.com/favicon.ico" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0d0f;
      --bg-card: #16161a;
      --bg-input: #22222a;
      --text: #e8e8ed;
      --text-dim: #8888a0;
      --accent: #e8a0bf;
      --accent-hover: #f0b8d0;
      --danger: #e85050;
      --radius: 16px;
      --radius-sm: 10px;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at 50% 0%, #1a1020 0%, var(--bg) 70%);
    }

    .auth-card {
      width: 100%;
      max-width: 400px;
      padding: 40px 32px;
      margin: 16px;
      background: var(--bg-card);
      border-radius: var(--radius);
      border: 1px solid #2a2a30;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .auth-logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .auth-logo h1 {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, #e8a0bf, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .auth-logo p {
      color: var(--text-dim);
      font-size: 14px;
      margin-top: 6px;
    }

    .tab-row {
      display: flex;
      margin-bottom: 24px;
      border-bottom: 1px solid #2a2a30;
    }
    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 14px;
      font-weight: 600;
      padding: 12px 0;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color 0.2s, border-color 0.2s;
    }
    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-dim);
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid #2a2a30;
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 15px;
      padding: 12px 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus {
      border-color: var(--accent);
    }
    .form-group input::placeholder {
      color: var(--text-dim);
      opacity: 0.6;
    }

    .auth-submit {
      width: 100%;
      padding: 13px 0;
      background: var(--accent);
      color: #0d0d0f;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 8px;
    }
    .auth-submit:hover { background: var(--accent-hover); }
    .auth-submit:active { transform: scale(0.98); }
    .auth-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    .auth-error {
      color: var(--danger);
      font-size: 13px;
      text-align: center;
      margin-top: 12px;
      min-height: 18px;
    }

    [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="auth-card">
    <div class="auth-logo">
      <h1>Blossom Learning</h1>
      <p>Student Portal — Sign in to continue</p>
    </div>

    <div class="tab-row">
      <button class="tab-btn active" id="tab-login">Sign In</button>
      <button class="tab-btn" id="tab-register">Create Account</button>
    </div>

    <form id="login-form">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="you@email.com" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-pass" placeholder="••••••••" required autocomplete="current-password" />
      </div>
      <div class="form-group" id="login-totp-group" hidden>
        <label>2FA Code</label>
        <input type="text" id="login-totp" inputmode="numeric" maxlength="6" placeholder="6-digit code" autocomplete="one-time-code" />
        <p class="auth-hint" style="font-size: 12px; color: var(--text-dim); margin-top: 6px;">Enter the code from your authenticator app.</p>
      </div>
      <button type="submit" class="auth-submit">Sign In</button>
      <div id="login-error" class="auth-error"></div>
    </form>

    <form id="register-form" hidden>
      <div class="form-group">
        <label>Display Name</label>
        <input type="text" id="reg-name" placeholder="Your name" autocomplete="name" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="you@email.com" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="reg-pass" placeholder="8+ chars, letter and number" required minlength="8" autocomplete="new-password" />
      </div>
      <div class="form-group" id="reg-invite-group" hidden>
        <label>Invite Code</label>
        <input type="text" id="reg-invite" placeholder="Invite code" autocomplete="off" />
      </div>
      <button type="submit" class="auth-submit">Create Account</button>
      <div id="register-error" class="auth-error"></div>
    </form>
  </div>

  <script>

    fetch("/auth/status").then(r => r.json()).then(s => { if (s.authenticated) window.location.replace("/"); });

    const tabLogin = document.getElementById("tab-login");
    const tabReg = document.getElementById("tab-register");
    const loginForm = document.getElementById("login-form");
    const regForm = document.getElementById("register-form");

    tabLogin.addEventListener("click", () => {
      tabLogin.classList.add("active"); tabReg.classList.remove("active");
      loginForm.hidden = false; regForm.hidden = true;
    });
    tabReg.addEventListener("click", () => {
      tabReg.classList.add("active"); tabLogin.classList.remove("active");
      regForm.hidden = false; loginForm.hidden = true;
    });

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const errEl = document.getElementById("login-error");
      const btn = loginForm.querySelector(".auth-submit");
      errEl.textContent = "";
      btn.disabled = true;
      try {
        const res = await fetch("/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: document.getElementById("login-email").value.trim(),
            password: document.getElementById("login-pass").value,
            totp: document.getElementById("login-totp").value.trim(),
          }),
        });
        const data = await res.json();
        if (!res.ok) {
          errEl.textContent = data.error || "Login failed";
          // 2FA enabled: reveal the code field and prompt for the next code
          if (data.totpRequired) {
            document.getElementById("login-totp-group").hidden = false;
            document.getElementById("login-totp").focus();
          }
          return;
        }
        window.location.replace("/");
      } catch { errEl.textContent = "Network error"; }
      finally { btn.disabled = false; }
    });

    regForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const errEl = document.getElementById("register-error");
      const btn = regForm.querySelector(".auth-submit");
      errEl.textContent = "";
      btn.disabled = true;
      try {
        const res = await fetch("/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: document.getElementById("reg-email").value.trim(),
            password: document.getElementById("reg-pass").value,
            displayName: document.getElementById("reg-name").value.trim(),
            inviteCode: document.getElementById("reg-invite").value.trim(),
          }),
        });
        const data = await res.json();
        if (!res.ok) {
          if (res.status === 403) document.getElementById("reg-invite-group").hidden = false;
          errEl.textContent = data.error || "Registration failed";
          return;
        }
        window.location.replace("/");
      } catch { errEl.textContent = "Network error"; }
      finally { btn.disabled = false; }
    });
</script>
</body>
</html>
