
app = 'blossom-nowvdq'
primary_region = 'ams'

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  PROXY_PREFIX = "/cdn/m/"
  EPOXY_PREFIX = "/cdn/n/"
  BAREMUX_PREFIX = "/cdn/w/"
  WISP_PATH = "/sock/"
  SCRAMJET_PREFIX = "/~/"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1

# Persistent volume for the SQLite DB (data/blossom.db).
# Created via: fly volumes create blossom_data -a blossom-nowvdq --region ams --size 1
# Keeps accounts, sessions, bookmarks and history across deploys/restarts.
[[mounts]]
  source = "blossom_data"
  destination = "/app/data"
