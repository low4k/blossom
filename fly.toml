# fly.toml app configuration file generated for blossom-nowvdq on 2026-09-01T04:15:32Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'blossom-nowvdq'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  BAREMUX_PREFIX = '/cdn/w/'
  EPOXY_PREFIX = '/cdn/n/'
  PORT = '8080'
  PROXY_PREFIX = '/cdn/m/'
  SCRAMJET_PREFIX = '/~/'
  WISP_PATH = '/sock/'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
