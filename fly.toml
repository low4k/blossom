app = "blossom"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  PROXY_PREFIX = "/cdn/m/"
  EPOXY_PREFIX = "/cdn/n/"
  BAREMUX_PREFIX = "/cdn/w/"
  WISP_PATH = "/sock/"
  SCRAMJET_PREFIX = "/~/"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
