
app = 'blossom-cold-cloud-8187'
primary_region = 'iad'

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  PROXY_PREFIX = "/cdn/m/"
  EPOXY_PREFIX = "/cdn/n/"
  BAREMUX_PREFIX = "/cdn/w/"
  WISP_PATH = "/sock/"
  SCRAMJET_PREFIX = "/~/"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1

# Persistent volume for the SQLite DB (data/blossom.db).
# Create it BEFORE deploying:  fly volumes create blossom_data --size 1 --region iad
# Then uncomment the section below, or every deploy/restart wipes user data.
# [[mounts]]
#   source = "blossom_data"
#   destination = "/app/data"
